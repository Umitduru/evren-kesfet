<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVREN KEŞFET — Telegram Mini App</title>
    
    <!-- Official Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(30, 41, 59, 0.8);
        }

        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen pb-24 overflow-x-hidden selection:bg-blue-500/30">

    <!-- OUTSIDE TELEGRAM BLOCK SCREEN -->
    <div id="auth-error-screen" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 bg-red-500/10 border border-red-500/30 rounded-2xl flex items-center justify-center mb-4 text-red-500">
            <i data-lucide="shield-alert" class="w-8 h-8"></i>
        </div>
        <h1 class="text-xl font-bold text-white mb-2">Erişim Engellendi</h1>
        <p class="text-slate-400 text-sm max-w-xs mb-6">
            Bu uygulama yalnızca Telegram içerisinden açılabilir. Lütfen botumuz üzerinden giriş yapın.
        </p>
        <a href="https://t.me/EvrenBosttBot" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition-all shadow-lg flex items-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i>
            @EvrenBosttBot'a Git
        </a>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="max-w-md mx-auto min-h-screen relative flex flex-col">
        
        <!-- STICKY HEADER -->
        <header class="pt-6 pb-4 px-4 sticky top-0 bg-slate-950/80 backdrop-blur-xl z-30 flex justify-between items-center border-b border-slate-800/50">
            <h1 class="text-xl font-black bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent tracking-tight">
                EVREN <span class="text-blue-500">KEŞFET</span>
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="switchView('explore')" class="w-9 h-9 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 active:scale-95 transition-transform">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- DYNAMIC MAIN CONTENT VIEW AREA -->
        <main id="main-content" class="flex-1 p-4 animate-fade">
            <!-- Dynamic UI loaded by JavaScript -->
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-xl border-t border-slate-800/80 px-6 py-2.5 z-40">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center gap-1 text-blue-500 transition-colors">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="text-[10px] font-bold">Ana Sayfa</span>
                </button>
                <button onclick="switchView('explore')" id="nav-explore" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                    <span class="text-[10px] font-bold">Keşfet</span>
                </button>
                <button onclick="switchView('submit')" id="nav-submit" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
                    <i data-lucide="plus-square" class="w-5 h-5"></i>
                    <span class="text-[10px] font-bold">Ekle</span>
                </button>
                <button onclick="switchView('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span class="text-[10px] font-bold">Profil</span>
                </button>
            </div>
        </nav>

        <!-- TOAST MESSAGE MODAL -->
        <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm hidden transition-all duration-300">
            <div id="toast-body" class="px-4 py-3 rounded-2xl shadow-xl backdrop-blur-md border text-white text-sm font-semibold text-center flex items-center justify-center gap-2">
                <span id="toast-message"></span>
            </div>
        </div>
    </div>

    <!-- FIREBASE SERVICES SDK (Modular v10 CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzHxMBOznG9ifddSbL0iaWqHWgJqIIJd8",
            authDomain: "evren-kesfet.firebaseapp.com",
            projectId: "evren-kesfet",
            storageBucket: "evren-kesfet.firebasestorage.app",
            messagingSenderId: "577502268144",
            appId: "1:577502268144:web:4fbc20bd5517cabe58d035",
            measurementId: "G-D201XLYNML"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.firebaseAnalytics = getAnalytics(app);
            window.logFirebaseEvent = logEvent;
            window.fsHelpers = { collection, query, where, orderBy, onSnapshot, addDoc, serverTimestamp };
            
            // Dispatch custom event to notify script that Firebase is ready
            window.dispatchEvent(new Event('firebaseInitReady'));
        } catch (e) {
            console.error("Firebase initialization failed:", e);
        }
    </script>

    <!-- MAIN JAVASCRIPT ENGINE -->
    <script>
        let currentView = 'home';
        let tgUser = null;
        let communities = [];
        let isLoadingCommunities = true;
        let firestoreError = null;

        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram?.WebApp;
            
            // STRICT TELEGRAM CHECK: Block access if initData or WebApp is missing
            if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
                document.getElementById('auth-error-screen').classList.remove('hidden');
                document.getElementById('app').classList.add('hidden');
                lucide.createIcons();
                return;
            }

            tgUser = tg.initDataUnsafe.user;
            tg.ready();
            tg.expand();

            // Wait for Firebase module script to trigger readiness
            if (window.db) {
                initFirestoreListener();
            } else {
                window.addEventListener('firebaseInitReady', () => initFirestoreListener());
            }

            switchView('home');
        });

        function initFirestoreListener() {
            if (!window.db || !window.fsHelpers) {
                firestoreError = "Veritabanı bağlantısı kurulamadı.";
                isLoadingCommunities = false;
                renderContent();
                return;
            }

            try {
                const { collection, query, where, orderBy, onSnapshot } = window.fsHelpers;
                const q = query(
                    collection(window.db, "communities"),
                    where("status", "==", "approved"),
                    orderBy("boostCount", "desc")
                );

                onSnapshot(q, (snapshot) => {
                    communities = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    isLoadingCommunities = false;
                    firestoreError = null;
                    renderContent();
                    lucide.createIcons();
                }, (err) => {
                    console.error("Firestore sync error:", err);
                    firestoreError = "Canlı veri senkronizasyon hatası: " + err.message;
                    isLoadingCommunities = false;
                    renderContent();
                });
            } catch (e) {
                console.error("Firestore listener setup error:", e);
                firestoreError = "Veritabanı dinleyicisi başlatılamadı.";
                isLoadingCommunities = false;
                renderContent();
            }
        }

        function switchView(view) {
            currentView = view;
            ['home', 'explore', 'submit', 'profile'].forEach(nav => {
                const el = document.getElementById(`nav-${nav}`);
                if (el) {
                    el.className = `flex flex-col items-center gap-1 transition-colors ${nav === view ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`;
                }
            });

            renderContent();
            lucide.createIcons();

            if (window.firebaseAnalytics && window.logFirebaseEvent) {
                window.logFirebaseEvent(window.firebaseAnalytics, `view_${view}`);
            }
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            if (currentView === 'home') main.innerHTML = getHomeHTML();
            else if (currentView === 'explore') main.innerHTML = getExploreHTML();
            else if (currentView === 'submit') main.innerHTML = getSubmitHTML();
            else if (currentView === 'profile') main.innerHTML = getProfileHTML();
        }

        function getHomeHTML() {
            if (isLoadingCommunities) {
                return `
                    <div class="flex flex-col items-center justify-center py-20 text-center space-y-3">
                        <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Veritabanından Yükleniyor...</p>
                    </div>
                `;
            }

            if (firestoreError) {
                return `
                    <div class="glass-card rounded-2xl p-6 text-center border border-red-500/30 my-8">
                        <i data-lucide="alert-circle" class="w-10 h-10 text-red-500 mx-auto mb-2"></i>
                        <h3 class="font-bold text-white mb-1">Veritabanı Bağlantı Hatası</h3>
                        <p class="text-slate-400 text-xs">${firestoreError}</p>
                    </div>
                `;
            }

            return `
                <div class="space-y-6">
                    <div class="glass-card rounded-3xl p-5 border border-indigo-500/30 bg-gradient-to-br from-indigo-900/30 to-purple-900/30">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold flex-shrink-0">
                                <i data-lucide="rocket" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-white text-base">Topluluğunu Öne Çıkar</h2>
                                <p class="text-slate-400 text-xs mt-0.5">Grupları ve kanalları anında keşfet.</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-white flex items-center gap-2">
                            <i data-lucide="flame" class="w-4 h-4 text-amber-500"></i> Onaylı Topluluklar
                        </h2>
                        <span class="text-xs text-slate-500 font-medium">${communities.length} Listelendi</span>
                    </div>

                    ${communities.length === 0 ? `
                        <div class="glass-card rounded-2xl p-8 text-center border border-slate-800 my-4">
                            <i data-lucide="inbox" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
                            <h3 class="font-bold text-white text-sm">Henüz Yayınlanmış Topluluk Bulunmuyor</h3>
                            <p class="text-slate-500 text-xs mt-1">Platforma ilk topluluğu siz gönderin!</p>
                        </div>
                    ` : `
                        <div class="space-y-3">
                            ${communities.map(c => renderCard(c)).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function getExploreHTML() {
            return `
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-white">Keşfet & Ara</h2>
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500"></i>
                        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Grup, kanal veya bot ara..." 
                               class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>
                    <div id="searchResults" class="space-y-3">
                        ${communities.length === 0 ? `
                            <p class="text-slate-500 text-xs text-center py-8">Aranacak topluluk bulunmuyor.</p>
                        ` : communities.map(c => renderCard(c)).join('')}
                    </div>
                </div>
            `;
        }

        function getSubmitHTML() {
            return `
                <div class="space-y-5">
                    <div>
                        <h2 class="text-lg font-bold text-white">Topluluk Gönder</h2>
                        <p class="text-slate-400 text-xs mt-1">Gönderiniz yöneticiler tarafından incelendikten sonra yayına alınır.</p>
                    </div>

                    <form onsubmit="handleCommunitySubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Tür</label>
                            <select id="subType" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                                <option value="group">👥 Grup</option>
                                <option value="channel">📢 Kanal</option>
                                <option value="bot">🤖 Bot</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Başlık / İsim</label>
                            <input type="text" id="subName" required placeholder="Örn: Yazılım Topluluğu" 
                                   class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Açıklama</label>
                            <textarea id="subDesc" required rows="3" placeholder="Kısaca topluluk amacını yazın..." 
                                      class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Telegram Bağlantısı (t.me/...)</label>
                            <input type="text" id="subUrl" required placeholder="https://t.me/ornek_kanal" 
                                   class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition-transform active:scale-95 shadow-lg">
                            İncelemeye Gönder
                        </button>
                    </form>
                </div>
            `;
        }

        function getProfileHTML() {
            if (!tgUser) return '';

            return `
                <div class="space-y-6 text-center pt-4">
                    <div class="inline-block relative">
                        <img src="${tgUser.photo_url || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + tgUser.id}" alt="Avatar" class="w-20 h-20 rounded-full mx-auto border-2 border-blue-500 bg-slate-800 object-cover">
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white">${tgUser.first_name || ''} ${tgUser.last_name || ''}</h2>
                        <p class="text-slate-500 text-xs">@${tgUser.username || 'kasif'}</p>
                    </div>
                    <div class="glass-card rounded-2xl p-4 border border-slate-800 text-center">
                        <span class="text-slate-400 text-xs block mb-1">Telegram ID</span>
                        <span class="text-white font-mono font-bold text-sm">${tgUser.id}</span>
                    </div>
                </div>
            `;
        }

        function renderCard(item) {
            const badgeMap = {
                group: '<span class="text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded text-[10px] font-bold">Grup</span>',
                channel: '<span class="text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded text-[10px] font-bold">Kanal</span>',
                bot: '<span class="text-green-400 bg-green-500/10 px-2 py-0.5 rounded text-[10px] font-bold">Bot</span>'
            };

            return `
                <div class="glass-card rounded-2xl p-4 space-y-3">
                    <div class="flex items-start gap-3">
                        <img src="${item.photoUrl || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + encodeURIComponent(item.name)}" alt="${item.name}" class="w-12 h-12 rounded-xl object-cover bg-slate-800 border border-slate-700 flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5">
                                <h3 class="font-bold text-white text-sm truncate">${item.name}</h3>
                                ${item.verified ? '<i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-blue-500 flex-shrink-0"></i>' : ''}
                            </div>
                            <p class="text-slate-400 text-xs line-clamp-2 mt-0.5">${item.description}</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs">
                        <div class="flex items-center gap-2">
                            ${badgeMap[item.type] || ''}
                            <span class="text-amber-400 font-bold flex items-center gap-1">
                                <i data-lucide="flame" class="w-3.5 h-3.5"></i> ${item.boostCount || 0}
                            </span>
                        </div>
                        ${item.telegramUrl ? `
                            <a href="${item.telegramUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs transition-all">
                                Katıl / İncele
                            </a>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        async function handleCommunitySubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "Gönderiliyor...";

            const name = document.getElementById('subName').value;
            const description = document.getElementById('subDesc').value;
            const type = document.getElementById('subType').value;
            const url = document.getElementById('subUrl').value;

            if (!window.db || !window.fsHelpers) {
                showToast("Veritabanı bağlantısı yok.", "error");
                btn.disabled = false;
                btn.textContent = "İncelemeye Gönder";
                return;
            }

            try {
                const { collection, addDoc, serverTimestamp } = window.fsHelpers;
                await addDoc(collection(window.db, "communities"), {
                    name,
                    description,
                    type,
                    telegramUrl: url,
                    status: 'pending',
                    createdBy: tgUser ? tgUser.id : 'unknown',
                    verified: false,
                    boostCount: 0,
                    createdAt: serverTimestamp()
                });

                showToast("Başvurunuz alındı! İncelemeden sonra yayınlanacaktır. 🎉", "success");
                switchView('home');
            } catch (err) {
                console.error("Submission error:", err);
                showToast("Gönderim başarısız: " + err.message, "error");
                btn.disabled = false;
                btn.textContent = "İncelemeye Gönder";
            }
        }

        function handleSearch(q) {
            const query = q.toLowerCase();
            const container = document.getElementById('searchResults');
            const filtered = communities.filter(c => c.name.toLowerCase().includes(query) || c.description.toLowerCase().includes(query));
            
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-xs text-center py-6">Sonuç bulunamadı.</p>`;
            } else {
                container.innerHTML = filtered.map(c => renderCard(c)).join('');
            }
            lucide.createIcons();
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const body = document.getElementById('toast-body');
            document.getElementById('toast-message').textContent = msg;

            body.className = `px-4 py-3 rounded-2xl shadow-xl backdrop-blur-md border text-white text-sm font-semibold text-center ${
                type === 'error' ? 'bg-red-600/90 border-red-500' : 'bg-blue-600/90 border-blue-500'
            }`;

            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }
    </script>
</body>
</html>
